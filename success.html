

<!doctype html>
<html class="h-100" lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  
  <link rel="icon" href="./assets/img/xicon.png" type="image/png">

  <title>Success</title>

  <link rel="stylesheet" href="./assets/css/index.css">
<style>
    
@keyframes fadeInFromTop {
  from {
    opacity: 0;
    transform: translateY(-30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.Success-body {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    width: 100%;
    height: 100%;
    opacity: 0;
    animation: fadeInFromTop 1s ease-in-out forwards;
    text-align: center;
}

.Success-body i{
    display: flex;
    justify-content: center;
    align-items: center;
    font-size:50px;
    height: 100px;
    width: 100px;
    margin-top: 140px;
    border: none;
    border: 6px solid black;
    border-radius:150px;
}

.Success-body a{
    margin: 50px;
}

.Success-body p{
    font-weight: 400;
}

.Success-body p b{
    font-weight: 600;
}
::selection {
  background-color: #bd1b1b; /* Highlight color */
  color: rgb(255, 255, 255);             /* Text color */
}
#logo{
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 20px;
}
#logo .logo-text{
  margin: 5px;
}
#logo span{
  font-size: 15px;
  font-weight: 400;
}
#logo p{
  font-size: 12px;
  font-weight: 500;
  margin-top: -5px;
}
#logo img{
  height: 120px;
  transform: translateY(-5px);
}
.link-fancy {
  cursor: pointer;
  font-weight: 500;
}
  </style>
</head>

<body class="d-flex h-100 w-100" data-bs-spy="scroll" data-bs-target="#navScroll">

  <div class="h-100 container-fluid">
    <div class="h-100 row d-flex align-items-stretch">
      <div class="col-12 d-flex align-items-start flex-column px-vw-5">
        <header class="mb-auto py-vh-2 col-12">
          <a id="logo" class="navbar-brand pe-4 fs-4" href="index.html">
            <img src="./assets/images/MainLogo2.png" alt="">
          </a>
        </header>
        <main class="Success-body">
            <i class="fa-solid fa-check" style="color: #bd1b1b;"></i>
            <h1 style="text-align: center; letter-spacing: 1px; color: #bd1b1b;">Success</h1><br>
            <p>We will reach out to you shortly <br><br><b>Thank you</b></p><br><br><br>
            <a onclick="history.back()" class="link-fancy main-button-slider">Go back</a>
        </main>
      </div>
    </div>
  </div>
  <script>
    // Add a small delay to ensure the fade-in effect is visible after DOM content loads
    window.addEventListener('load', () => {
      const formBody = document.querySelector('.Success-body');
      formBody.style.opacity = '1';
    });
  </script>
</body>

</html>
