<style>
/* Default desktop styles - hover dropdown */
.dropdown {
  position: relative;
}

.dropdown-menu {
  position: absolute;
  top: 100%;
  left: 0;
  z-index: 1000;
  display: none;
  float: left;
  min-width: 160px;
  padding: 5px 0;
  margin: 2px 0 0;
  font-size: 14px;
  text-align: left;
  list-style: none;
  background-color: #ffffff;
  background-clip: padding-box;
  border-radius: 4px;
  box-shadow: 0 6px 12px rgba(0,0,0,.175);
  text-align: center;
}

.dropdown:hover .dropdown-menu {
  display: block;
}

/* Mobile styles - clickable dropdown */
@media (max-width: 991px) {
  .dropdown:hover .dropdown-menu {
    display: none; /* Disable hover on mobile */
  }
  
  .dropdown.open .dropdown-menu {
    display: block;
    position: static;
    float: none; 
    width: auto;
    margin-top: 0;
    background-color: transparent;
    border: 0;
    box-shadow: none;
  }
  
  .menu-trigger.active + .nav {
    display: block;
  }

  .dropdown-menu {
    text-align: center; /* Align text to the left on mobile */
  }
}


.dropdown-menu > li > a {
  /* 4. Ensure the links inside the list items span the full width of the menu */
  display: block; 
  /* 5. Set text alignment for the links themselves */
  text-align: left; 
  /* 6. Add some horizontal padding for visual spacing, if needed */
  padding: 3px 20px; 
}

@media (max-width: 991px) {
  .dropdown-menu > li > a {
    text-align: center; /* Align text to the left on mobile */
    padding: 10px 15px; /* Adjust padding for better touch targets */
  }
}

</style>
